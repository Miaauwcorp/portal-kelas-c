<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Kelas C</title>
  <meta name="description" content="Portal Kelas C: materi, tugas, jadwal, forum diskusi, dan galeri kegiatan.">
  <meta name="theme-color" content="#1E3B33">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23E3B23C'/%3E%3Ctext x='50%25' y='56%25' text-anchor='middle' dominant-baseline='middle' font-family='Arial' font-weight='700' font-size='40' fill='%231E3B33'%3EC%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar" aria-label="Menu utama">
    <a class="merek" href="#beranda">
      <span class="merek-huruf" id="merekHuruf">C</span>
      <span><strong id="merekNama">C Class</strong><small>Portal kelas</small></span>
    </a>
    <nav class="nav" id="nav"></nav>
    <p class="sidebar-kaki">Developed with ❤️ by Kelas C. powered by notion</p>
  </aside>
  <div class="tirai" id="tirai" hidden></div>

  <!-- Isi utama -->
  <div class="utama">
    <header class="bilah-atas">
      <button class="tombol-menu" id="tombolMenu" type="button" aria-label="Buka menu"
              aria-controls="sidebar" aria-expanded="false" data-ikon="menu"></button>
      <span class="bilah-judul" id="bilahJudul">Kelas C</span>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>

  <!-- Lapisan Notion layar penuh -->
  <section class="notion" id="notion" hidden aria-label="Halaman Notion">
    <div class="notion-bar">
      <button class="tombol-kembali" id="notionKembali" type="button" data-ikon="kembali">Beranda</button>
      <strong class="notion-judul" id="notionJudul"></strong>
      <div class="notion-aksi">
        <a class="tombol-ikon" id="notionBaru" target="_blank" rel="noopener"
           title="Buka di tab baru" aria-label="Buka di tab baru" data-ikon="keluar"></a>
        <button class="tombol-ikon" id="notionPenuh" type="button"
                title="Layar penuh" aria-label="Layar penuh" data-ikon="perbesar"></button>
      </div>
    </div>
    <div class="notion-isi">
      <div class="notion-muat" id="notionMuat"><span class="putar"></span><span>Memuat halaman…</span></div>
      <iframe id="notionFrame" title="Konten Notion" allow="fullscreen; clipboard-write"></iframe>
      <div class="notion-kosong" id="notionKosong" hidden></div>
    </div>
  </section>

  <!-- Penampil foto -->
  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Penampil foto">
    <button class="lb-tombol lb-tutup" id="lbTutup" type="button" aria-label="Tutup" data-ikon="tutup"></button>
    <button class="lb-tombol lb-sebelum" id="lbSebelum" type="button" aria-label="Foto sebelumnya" data-ikon="kiri"></button>
    <figure class="lb-figur">
      <img id="lbGambar" alt="">
      <figcaption id="lbKet"></figcaption>
    </figure>
    <button class="lb-tombol lb-berikut" id="lbBerikut" type="button" aria-label="Foto berikutnya" data-ikon="kanan"></button>
    <a class="lb-unduh" id="lbUnduh" target="_blank" rel="noopener" data-ikon="unduh">Unduh</a>
    <button class="lb-hapus" id="lbHapus" type="button" aria-label="Hapus foto" data-ikon="sampah">Hapus</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
